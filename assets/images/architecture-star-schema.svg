<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="dimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="factGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad)" />

  <!-- Title Banner -->
  <rect x="0" y="0" width="1200" height="70" fill="#0b1120" />
  <text x="40" y="42" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="700">PharmaPulse™ Enterprise Semantic Data Model Architecture</text>
  <text x="800" y="42" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="600">Star-Schema Design • In-Memory VertiPaq Engine</text>

  <!-- ================= CENTRAL CONFORMED DIMENSION ================= -->
  <!-- DateTable -->
  <g transform="translate(450, 100)" filter="url(#shadow)">
    <rect width="300" height="240" rx="10" fill="#1e293b" stroke="#0284c7" stroke-width="2" />
    <rect width="300" height="42" rx="8" fill="url(#dimGrad)" />
    <text x="20" y="26" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">DIMENSION: DateTable</text>
    <text x="260" y="26" fill="#e0f2fe" font-family="sans-serif" font-size="11" font-weight="600">[DIM]</text>

    <g transform="translate(20, 60)" font-family="sans-serif" font-size="12" fill="#cbd5e1">
      <text x="0" y="15" fill="#38bdf8" font-weight="700">🔑 Date [PK] (Date/Time)</text>
      <text x="0" y="40">Year (Integer)</text>
      <text x="0" y="65">Month (Integer / Text)</text>
      <text x="0" y="90">Quarter (Text)</text>
      <text x="0" y="115">Day (Integer)</text>
      <text x="0" y="140" fill="#10b981" font-weight="600">📐 Previous Month Sales (DAX Measure)</text>
      <text x="0" y="165" fill="#94a3b8">Date Hierarchy (Year > Qtr > Mo > Day)</text>
    </g>
  </g>

  <!-- ================= FACT TABLES ================= -->

  <!-- MonthlySales (Left Fact) -->
  <g transform="translate(60, 390)" filter="url(#shadow)">
    <rect width="320" height="250" rx="10" fill="url(#factGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="320" height="38" rx="8" fill="#334155" />
    <text x="18" y="24" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">FACT: MonthlySales</text>
    <text x="265" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11">[FACT]</text>

    <g transform="translate(18, 55)" font-family="sans-serif" font-size="11" fill="#cbd5e1">
      <text x="0" y="15" fill="#f59e0b" font-weight="700">🔗 datum [FK] (Date)</text>
      <text x="0" y="38">M01AB, M01AE (NSAIDs volume)</text>
      <text x="0" y="60">N02BA, N02BE (Analgesics volume)</text>
      <text x="0" y="82">N05B, N05C (Psycholeptics volume)</text>
      <text x="0" y="104">R03, R06 (Respiratory / Allergy volume)</text>
      <line x1="0" y1="120" x2="280" y2="120" stroke="#334155" />
      <text x="0" y="140" fill="#38bdf8" font-weight="700">📐 Total Monthly Sales (DAX Measure)</text>
      <text x="0" y="162" fill="#94a3b8">Granularity: 1 Row per Calendar Month</text>
      <text x="0" y="180" fill="#94a3b8">Cardinality: 70 Rows Total</text>
    </g>
  </g>

  <!-- WeeklySales (Center Fact) -->
  <g transform="translate(440, 390)" filter="url(#shadow)">
    <rect width="320" height="250" rx="10" fill="url(#factGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="320" height="38" rx="8" fill="#334155" />
    <text x="18" y="24" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">FACT: WeeklySales</text>
    <text x="265" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11">[FACT]</text>

    <g transform="translate(18, 55)" font-family="sans-serif" font-size="11" fill="#cbd5e1">
      <text x="0" y="15" fill="#f59e0b" font-weight="700">🔗 datum [FK] (Week Beginning Date)</text>
      <text x="0" y="38">M01AB, M01AE (NSAIDs volume)</text>
      <text x="0" y="60">N02BA, N02BE (Analgesics volume)</text>
      <text x="0" y="82">N05B, N05C (Psycholeptics volume)</text>
      <text x="0" y="104">R03, R06 (Respiratory / Allergy volume)</text>
      <line x1="0" y1="120" x2="280" y2="120" stroke="#334155" />
      <text x="0" y="140" fill="#38bdf8" font-weight="700">📐 Total Weekly Sales (DAX Measure)</text>
      <text x="0" y="162" fill="#94a3b8">Granularity: 1 Row per Calendar Week</text>
      <text x="0" y="180" fill="#94a3b8">Cardinality: 302 Rows Total</text>
    </g>
  </g>

  <!-- DailySales (Right Fact) -->
  <g transform="translate(820, 390)" filter="url(#shadow)">
    <rect width="320" height="250" rx="10" fill="url(#factGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="320" height="38" rx="8" fill="#334155" />
    <text x="18" y="24" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">FACT: DailySales</text>
    <text x="265" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11">[FACT]</text>

    <g transform="translate(18, 55)" font-family="sans-serif" font-size="11" fill="#cbd5e1">
      <text x="0" y="15" fill="#f59e0b" font-weight="700">🔗 datum [FK] (Date/Timestamp)</text>
      <text x="0" y="38">Hour (0-23), Weekday Name (Mon-Sun)</text>
      <text x="0" y="60">Year (Integer), M01AB..R06 Categories</text>
      <line x1="0" y1="80" x2="280" y2="80" stroke="#334155" />
      <text x="0" y="105" fill="#38bdf8" font-weight="700">📐 Total Daily Sales (DAX Measure)</text>
      <text x="0" y="128" fill="#94a3b8">Granularity: Point-of-Sale Hourly Transaction</text>
      <text x="0" y="150" fill="#94a3b8">Cardinality: 2,106 Daily / 50K+ Records</text>
      <text x="0" y="172" fill="#10b981">Optimized for AI Root Cause Decomposition</text>
    </g>
  </g>

  <!-- ================= RELATIONSHIP CONNECTORS ================= -->

  <!-- Relationship: DateTable -> MonthlySales -->
  <path d="M 480 340 L 480 365 L 220 365 L 220 390" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="480" cy="340" r="5" fill="#38bdf8" />
  <rect x="470" y="345" width="20" height="16" rx="3" fill="#0284c7" />
  <text x="480" y="357" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <rect x="210" y="370" width="20" height="16" rx="3" fill="#f59e0b" />
  <text x="220" y="382" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">*</text>

  <!-- Relationship: DateTable -> WeeklySales -->
  <path d="M 600 340 L 600 390" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="600" cy="340" r="5" fill="#38bdf8" />
  <rect x="590" y="345" width="20" height="16" rx="3" fill="#0284c7" />
  <text x="600" y="357" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <rect x="590" y="370" width="20" height="16" rx="3" fill="#f59e0b" />
  <text x="600" y="382" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">*</text>

  <!-- Relationship: DateTable -> DailySales -->
  <path d="M 720 340 L 720 365 L 980 365 L 980 390" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="720" cy="340" r="5" fill="#38bdf8" />
  <rect x="710" y="345" width="20" height="16" rx="3" fill="#0284c7" />
  <text x="720" y="357" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <rect x="970" y="370" width="20" height="16" rx="3" fill="#f59e0b" />
  <text x="980" y="382" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">*</text>

  <!-- Legend & Technology Footer -->
  <rect x="60" y="650" width="1080" height="24" rx="4" fill="#0b1120" />
  <text x="80" y="666" fill="#94a3b8" font-family="sans-serif" font-size="11">Single-Direction Cross-Filtering (1:Many) • Conformed Calendar Dimension • Zero Many-to-Many Ambiguity • RLS-Ready</text>

</svg>